[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefixlab"
version = "0.1.0"
description = "Prefix-cache eviction policies for paged KV cache under multi-turn agent workloads"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
model = ["torch", "transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
